<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Parkour 0 — Реальный Новосибирск</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #0a0a1a; font-family: Arial, sans-serif; }
        #cesiumContainer { width: 100vw; height: 100vh; }
        #ui {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            display: flex; flex-direction: column;
            justify-content: space-between; padding: 20px;
        }
        #top-bar {
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: auto;
        }
        #backBtn {
            padding: 8px 20px; border: 1px solid rgba(255,46,99,0.3);
            background: rgba(0,0,0,0.6); color: #fff; text-decoration: none;
            border-radius: 12px; font-size: 14px; cursor: pointer;
        }
        #spawnLabel {
            color: #00ffc8; font-size: 14px;
            background: rgba(0,0,0,0.6); padding: 6px 18px; border-radius: 30px;
            border: 1px solid #00ffc8;
            font-family: Arial, sans-serif;
        }
        #controls-hint {
            text-align: center;
            color: rgba(255,255,255,0.15); font-size: 12px;
            background: rgba(0,0,0,0.3); padding: 6px 16px; border-radius: 20px;
            pointer-events: none;
            margin: 0 auto 10px auto;
        }
        #controls-hint span { color: #ff2e63; }
        #mobileControls {
            position: fixed; bottom: 20px; left: 0; right: 0;
            display: none; justify-content: space-between; padding: 0 16px; z-index: 20;
            pointer-events: none;
        }
        @media (max-width: 1024px) { #mobileControls { display: flex !important; } }
        .ctrl-btn {
            width: 62px; height: 62px; border-radius: 50%;
            border: 2px solid rgba(255,46,99,0.5);
            background: rgba(255,46,99,0.15);
            backdrop-filter: blur(8px);
            color: #fff; font-size: 26px;
            display: flex; align-items: center; justify-content: center;
            touch-action: none; transition: 0.1s;
            user-select: none; pointer-events: auto;
        }
        .ctrl-btn:active { background: rgba(255,46,99,0.4); transform: scale(0.90); }
        .ctrl-btn.jump-btn {
            width: 76px; height: 76px;
            background: rgba(0,255,200,0.15);
            border-color: rgba(0,255,200,0.5);
            color: #00ffc8;
        }
        .dpad-row { display: flex; gap: 10px; justify-content: center; }
        #rightPad { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: auto; }
        #leftPad { display: flex; gap: 10px; pointer-events: auto; }
        @media (max-width: 480px) {
            .ctrl-btn { width: 52px; height: 52px; font-size: 20px; }
            .ctrl-btn.jump-btn { width: 64px; height: 64px; font-size: 22px; }
            #controls-hint { font-size: 10px; }
            #spawnLabel { font-size: 11px; padding: 4px 12px; }
        }
    </style>
</head>
<body>

    <div id="cesiumContainer"></div>

    <div id="ui">
        <div id="top-bar">
            <span id="spawnLabel">📍 СПАВН — ЖК ИСТОРИЯ</span>
            <button id="backBtn" onclick="location.href='/'">🚪 ВЫЙТИ</button>
        </div>
        <div id="controls-hint">🏙️ <span>РЕАЛЬНЫЙ НОВОСИБИРСК</span> · КАМЕРА — ТАЧ · ПОПРОБУЙ НАЙТИ ЖК!</div>
    </div>

    <div id="mobileControls">
        <div id="leftPad">
            <div class="dpad">
                <div class="dpad-row"><button class="ctrl-btn" id="btnUp">▲</button></div>
                <div class="dpad-row">
                    <button class="ctrl-btn" id="btnLeft">◀</button>
                    <button class="ctrl-btn" id="btnDown">▼</button>
                    <button class="ctrl-btn" id="btnRight">▶</button>
                </div>
            </div>
        </div>
        <div id="rightPad">
            <button class="ctrl-btn jump-btn" id="btnJump">⬆</button>
        </div>
    </div>

    <!-- CesiumJS -->
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.117/Build/Cesium/Widgets/widgets.css">
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.117/Build/Cesium/Cesium.js"></script>

    <script>
        // ========== НАСТРОЙКА CESIUM ==========
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI4YjUyZjMxZC1jZjhmLTQwY2UtYTc4MS1hMzQ5MzM2YzQ5MjMiLCJpZCI6MjU1MjIzLCJpYXQiOjE3MjQ2NzY4OTl9.VZK4qJ-M0o2jt8q5sFgy_zGwhm-XwYhNwsDysuCdrpc';

        const viewer = new Cesium.Viewer('cesiumContainer', {
            baseLayerPicker: false,
            geocoder: false,
            timeline: false,
            animation: false,
            infoBox: false,
            selectionIndicator: false,
            navigationHelpButton: false,
            scene3DOnly: true,
        });

        // ========== КАМЕРА ==========
        viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(82.9875, 55.0633, 500),
            orientation: {
                heading: Cesium.Math.toRadians(0),
                pitch: Cesium.Math.toRadians(-45),
                roll: 0
            }
        });

        // ========== ВЫКЛЮЧАЕМ НЕНУЖНОЕ ==========
        viewer.scene.globe.enableLighting = false;
        viewer.scene.skyAtmosphere.show = true;

        // ========== КНОПКИ ДЛЯ ТЕЛЕФОНА ==========
        function setupTouch(id, onStart, onEnd) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(); }, { passive: false });
            el.addEventListener('touchend', (e) => { e.preventDefault(); onEnd(); }, { passive: false });
            el.addEventListener('touchcancel', () => onEnd(), { passive: false });
            el.addEventListener('mousedown', onStart);
            el.addEventListener('mouseup', onEnd);
            el.addEventListener('mouseleave', onEnd);
        }

        // Перемещение камеры по нажатию кнопок
        let moveInterval = null;

        function startMove(dx, dy) {
            if (moveInterval) return;
            moveInterval = setInterval(() => {
                const camera = viewer.camera;
                const direction = new Cesium.Cartesian3(0, 0, 0);
                if (dx) direction.x = dx * 2;
                if (dy) direction.y = dy * 2;
                camera.move(direction);
            }, 50);
        }

        function stopMove() {
            if (moveInterval) {
                clearInterval(moveInterval);
                moveInterval = null;
            }
        }

        // Вверх/вниз — двигаем камеру вперёд/назад
        setupTouch('btnUp', () => startMove(0, 5), stopMove);
        setupTouch('btnDown', () => startMove(0, -5), stopMove);
        setupTouch('btnLeft', () => startMove(-5, 0), stopMove);
        setupTouch('btnRight', () => startMove(5, 0), stopMove);

        // Прыжок — поднять камеру вверх
        setupTouch('btnJump', () => {
            const camera = viewer.camera;
            const up = new Cesium.Cartesian3(0, 0, 10);
            camera.move(up);
        }, () => {});

        // ========== МАРКЕР НА ЖК ИСТОРИЯ ==========
        viewer.entities.add({
            position: Cesium.Cartesian3.fromDegrees(82.9875, 55.0633, 100),
            billboard: {
                image: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><text y="32" font-size="32">📍</text></svg>',
                scale: 2,
                verticalOrigin: Cesium.VerticalOrigin.BOTTOM
            },
            label: {
                text: '📍 ЖК "История"',
                font: '16px Arial',
                fillColor: Cesium.Color.CYAN,
                outlineColor: Cesium.Color.BLACK,
                outlineWidth: 2,
                style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                pixelOffset: new Cesium.Cartesian2(0, -30)
            }
        });

        // ========== ПЕРСОНАЖ (ГОПНИК) ==========
        // Пока что просто точка на карте
        // Если хочешь, можно добавить 3D-модель гопника через GLTF

        console.log('🔥 Реальный Новосибирск загружен! Ищи ЖК "История" на карте!');
    </script>
</body>
    </html>
