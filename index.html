<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Parkour 0 — Дзержинский</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #0a0a1a; font-family: Arial, sans-serif; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            display: flex; flex-direction: column;
            justify-content: space-between; padding: 20px;
        }
        #top-bar {
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: auto;
        }
        #backBtn {
            padding: 8px 20px; border: 1px solid rgba(255,46,99,0.3);
            background: rgba(0,0,0,0.6); color: #fff; text-decoration: none;
            border-radius: 12px; font-size: 14px; cursor: pointer;
        }
        #spawnLabel {
            color: #00ffc8; font-size: 14px;
            background: rgba(0,0,0,0.6); padding: 6px 18px; border-radius: 30px;
            border: 1px solid #00ffc8;
            font-family: Arial, sans-serif;
        }
        #controls-hint {
            text-align: center;
            color: rgba(255,255,255,0.15); font-size: 12px;
            background: rgba(0,0,0,0.3); padding: 6px 16px; border-radius: 20px;
            pointer-events: none;
            margin: 0 auto 10px auto;
        }
        #controls-hint span { color: #ff2e63; }
        #mobileControls {
            position: fixed; bottom: 20px; left: 0; right: 0;
            display: none; justify-content: space-between; padding: 0 16px; z-index: 20;
            pointer-events: none;
        }
        @media (max-width: 1024px) { #mobileControls { display: flex !important; } }
        .ctrl-btn {
            width: 62px; height: 62px; border-radius: 50%;
            border: 2px solid rgba(255,46,99,0.5);
            background: rgba(255,46,99,0.15);
            backdrop-filter: blur(8px);
            color: #fff; font-size: 26px;
            display: flex; align-items: center; justify-content: center;
            touch-action: none; transition: 0.1s;
            user-select: none; pointer-events: auto;
        }
        .ctrl-btn:active { background: rgba(255,46,99,0.4); transform: scale(0.90); }
        .ctrl-btn.jump-btn {
            width: 76px; height: 76px;
            background: rgba(0,255,200,0.15);
            border-color: rgba(0,255,200,0.5);
            color: #00ffc8;
        }
        .dpad-row { display: flex; gap: 10px; justify-content: center; }
        #rightPad { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: auto; }
        #leftPad { display: flex; gap: 10px; pointer-events: auto; }
        @media (max-width: 480px) {
            .ctrl-btn { width: 52px; height: 52px; font-size: 20px; }
            .ctrl-btn.jump-btn { width: 64px; height: 64px; font-size: 22px; }
            #controls-hint { font-size: 10px; }
            #spawnLabel { font-size: 11px; padding: 4px 12px; }
        }
    </style>
</head>
<body>

    <div id="ui">
        <div id="top-bar">
            <span id="spawnLabel">📍 СПАВН — ЖК ИСТОРИЯ</span>
            <button id="backBtn" onclick="location.href='/'">🚪 ВЫЙТИ</button>
        </div>
        <div id="controls-hint">🏙️ <span>ДЗЕРЖИНСКИЙ РАЙОН</span> · WASD — БЕГ · ПРОБЕЛ — ПРЫЖОК</div>
    </div>

    <div id="mobileControls">
        <div id="leftPad">
            <div class="dpad">
                <div class="dpad-row"><button class="ctrl-btn" id="btnUp">▲</button></div>
                <div class="dpad-row">
                    <button class="ctrl-btn" id="btnLeft">◀</button>
                    <button class="ctrl-btn" id="btnDown">▼</button>
                    <button class="ctrl-btn" id="btnRight">▶</button>
                </div>
            </div>
        </div>
        <div id="rightPad">
            <button class="ctrl-btn jump-btn" id="btnJump">⬆</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
            "@mnemopay/map3d": "https://cdn.jsdelivr.net/npm/@mnemopay/map3d@0.0.1/dist/index.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { fetchScene } from '@mnemopay/map3d/overpass';
        import { buildSceneRoot } from '@mnemopay/map3d';

        // ========== СЦЕНА ==========
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.Fog(0x0a0a1a, 80, 150);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 15, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // ========== СВЕТ ==========
        const ambient = new THREE.AmbientLight(0x40406b, 0.6);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffeedd, 1.5);
        sun.position.set(30, 50, 20);
        sun.castShadow = true;
        scene.add(sun);

        // ========== ЗЕМЛЯ ==========
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200),
            new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.9 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.5;
        ground.receiveShadow = true;
        scene.add(ground);

        // ========== OSM — ДЗЕРЖИНСКИЙ РАЙОН ==========
        const bbox = {
            south: 55.055,
            west: 82.970,
            north: 55.075,
            east: 83.000
        };

        let cityRoot = null;
        let buildings = [];

        fetchScene(bbox).then(data => {
            cityRoot = buildSceneRoot(data);
            cityRoot.scale.set(1, 1, 1);
            cityRoot.position.set(0, -0.5, 0);
            scene.add(cityRoot);
            console.log('✅ Дзержинский район загружен!');

            cityRoot.traverse((child) => {
                if (child.isMesh) {
                    buildings.push(child);
                }
            });

            buildings.forEach(building => {
                const box = new CANNON.Body({ mass: 0 });
                const size = new THREE.Vector3();
                building.geometry.computeBoundingBox();
                const bbox = building.geometry.boundingBox;
                const width = bbox.max.x - bbox.min.x;
                const height = bbox.max.y - bbox.min.y;
                const depth = bbox.max.z - bbox.min.z;
                box.addShape(new CANNON.Box(new CANNON.Vec3(width/2, height/2, depth/2)));
                box.position.set(building.position.x, building.position.y, building.position.z);
                world.addBody(box);
            });
        }).catch(err => {
            console.error('❌ Ошибка OSM:', err);
            showFallbackMap();
        });

        function showFallbackMap() {
            const mapLoader = new THREE.TextureLoader();
            const mapUrl = 'https://static-maps.yandex.ru/1.x/?ll=82.9875,55.0633&z=17&l=map&size=1024,1024&pt=82.9875,55.0633,pm2rdl';
            mapLoader.load(mapUrl, (texture) => {
                const mapMesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(100, 100),
                    new THREE.MeshStandardMaterial({ map: texture })
                );
                mapMesh.rotation.x = -Math.PI / 2;
                mapMesh.position.y = -0.4;
                scene.add(mapMesh);
                console.log('🗺️ Запасная карта загружена!');
            });
        }

        // ========== ПЕРСОНАЖ-ГОПНИК (АБУБАС) ==========
        const player = new THREE.Group();

        const body = new THREE.Mesh(
            new THREE.BoxGeometry(0.7, 0.8, 0.4),
            new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4 })
        );
        body.position.y = 0.4;
        body.castShadow = true;
        player.add(body);

        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = '#000000';
        ctx.fillRect(20, 0, 16, 256);
        ctx.fillRect(120, 0, 16, 256);
        ctx.fillRect(220, 0, 16, 256);
        ctx.font = 'bold 40px Arial';
        ctx.fillStyle = '#000000';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('АБУБАС', 128, 100);
        ctx.font = '30px Arial';
        ctx.fillText('⚽', 128, 170);
        const texture = new THREE.CanvasTexture(canvas);
        const shirt = new THREE.Mesh(
            new THREE.PlaneGeometry(0.6, 0.4),
            new THREE.MeshStandardMaterial({ map: texture })
        );
        shirt.position.set(0, 0.45, 0.26);
        player.add(shirt);

        const pants = new THREE.Mesh(
            new THREE.BoxGeometry(0.7, 0.4, 0.4),
            new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.7 })
        );
        pants.position.set(0, 0.0, 0);
        pants.castShadow = true;
        player.add(pants);

        const head = new THREE.Mesh(
            new THREE.SphereGeometry(0.25, 12, 12),
            new THREE.MeshStandardMaterial({ color: 0xffcc99 })
        );
        head.position.y = 1.1;
        head.castShadow = true;
        player.add(head);

        const cap = new THREE.Mesh(
            new THREE.CylinderGeometry(0.3, 0.32, 0.05, 8),
            new THREE.MeshStandardMaterial({ color: 0x1a1a2e })
        );
        cap.position.set(0, 1.28, 0);
        cap.rotation.x = 0.1;
        player.add(cap);

        const SPAWN_X = 0;
        const SPAWN_Z = 0;
        player.position.set(SPAWN_X, 0.5, SPAWN_Z);
        scene.add(player);

        // ========== ФИЗИКА ==========
        const world = new CANNON.World();
        world.gravity.set(0, -25, 0);

        const groundPhys = new CANNON.Body({ mass: 0 });
        groundPhys.addShape(new CANNON.Plane());
        groundPhys.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0), -Math.PI/2);
        world.addBody(groundPhys);

        const playerPhys = new CANNON.Body({ mass: 70 });
        playerPhys.addShape(new CANNON.Box(new CANNON.Vec3(0.35, 0.6, 0.2)));
        playerPhys.position.set(SPAWN_X, 2, SPAWN_Z);
        playerPhys.linearDamping = 0.92;
        world.addBody(playerPhys);

        // ========== УПРАВЛЕНИЕ ==========
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let jumpCount = 0;

        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': keys.w = true; e.preventDefault(); break;
                case 'KeyA': keys.a = true; e.preventDefault(); break;
                case 'KeyS': keys.s = true; e.preventDefault(); break;
                case 'KeyD': keys.d = true; e.preventDefault(); break;
                case 'Space':
                    e.preventDefault();
                    if (jumpCount < 2) {
                        playerPhys.velocity.y = 7;
                        jumpCount++;
                    }
                    break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': keys.w = false; break;
                case 'KeyA': keys.a = false; break;
                case 'KeyS': keys.s = false; break;
                case 'KeyD': keys.d = false; break;
            }
        });

        function setupTouch(id, onStart, onEnd) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(); }, { passive: false });
            el.addEventListener('touchend', (e) => { e.preventDefault(); onEnd(); }, { passive: false });
            el.addEventListener('touchcancel', () => onEnd(), { passive: false });
            el.addEventListener('mousedown', onStart);
            el.addEventListener('mouseup', onEnd);
            el.addEventListener('mouseleave', onEnd);
        }

        setupTouch('btnUp', () => keys.w = true, () => keys.w = false);
        setupTouch('btnDown', () => keys.s = true, () => keys.s = false);
        setupTouch('btnLeft', () => keys.a = true, () => keys.a = false);
        setupTouch('btnRight', () => keys.d = true, () => keys.d = false);
        setupTouch('btnJump', () => {
            if (jumpCount < 2) {
                playerPhys.velocity.y = 7;
                jumpCount++;
            }
        }, () => {});

        // ========== ИГРОВОЙ ЦИКЛ ==========
        function animate() {
            requestAnimationFrame(animate);

            const speed = 5;
            const dir = new THREE.Vector3();
            const forward = new THREE.Vector3(-Math.sin(camera.rotation.y), 0, -Math.cos(camera.rotation.y));
            const right = new THREE.Vector3(Math.cos(camera.rotation.y), 0, -Math.sin(camera.rotation.y));
            dir.addScaledVector(right, (keys.d ? 1 : 0) - (keys.a ? 1 : 0));
            dir.addScaledVector(forward, (keys.s ? 1 : 0) - (keys.w ? 1 : 0));
            if (dir.length() > 0) dir.normalize();

            playerPhys.velocity.x = dir.x * speed;
            playerPhys.velocity.z = dir.z * speed;

            if (playerPhys.position.y < 0.6) jumpCount = 0;

            player.position.copy(playerPhys.position);
            player.position.y -= 0.5;

            if (dir.length() > 0.1) {
                const target = Math.atan2(dir.x, dir.z);
                let current = player.rotation.y;
                let diff = target - current;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                player.rotation.y += diff * 0.15;
            }

            world.step(1 / 60);

            const targetCam = new THREE.Vector3(
                player.position.x,
                player.position.y + 2.5,
                player.position.z + 6
            );
            camera.position.lerp(targetCam, 0.08);
            camera.lookAt(
                player.position.x,
                player.position.y + 0.5,
                player.position.z
            );

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
  </html>
